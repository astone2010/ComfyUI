[project]
name = "ComfyUI"
version = "0.43.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.0",
    "aiohttp>=3.11.8",
    "alembic>=1.20.0",
    "av>=17.0.0",
    "blake3>=1.0.10",
    "blend-modes>=2.2.0",
    "chardet>=7.7.0",
    "clip-interrogator>=0.6.0",
    "color-matcher>=0.6.0",
    "colour-science>=0.4.6",
    "comfy-aimdo==0.6.0",
    "comfy-angle>=0.1.1",
    "comfy-kitchen==0.2.40",
    "comfyui-embedded-docs>=0.5.15",
    "comfyui-frontend-package>=1.57.4",
    "comfyui-workflow-templates>=0.11.97",
    "cstr",
    "diffusers>=0.33.1",
    "dill>=0.4.1",
    "einops>=0.6",
    "fairscale>=0.4.4",
    "faster-whisper>=1.1",
    "ffmpy",
    "filelock>=4.1.0",
    "gguf>=0.19.0",
    "gitpython>=3.2.1",
    "huggingface-hub>=0.27",
    "imageio>=2.38.0",
    "imageio-ffmpeg>=0.6.0",
    "img2texture",
    "joblib>=1.6.0",
    "kornia>=0.7.1",
    "lark>=1.3.1",
    "librosa>=0.11.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "matrix-nio>=0.26.0",
    "mss>=10.2.0",
    "mutagen>=1.48.1",
    "nh3>=0.3.7",
    "numba>=0.62",
    "numpy>=1.26.4",
    "omegaconf>=2.3.0",
    "omnivoice>=0.1.0",
    "onnxruntime>=1.23.2",
    "openai-whisper>=20250625",
    "opencv-contrib-python>=5.0.0.93",
    "opencv-python>=5.0.0.93",
    "opencv-python-headless[ffmpeg]>=5.0.0.93",
    "orjson>=3.13.0",
    "packaging>=26.3",
    "pedalboard>=0.9.26",
    "peft>=0.21.2",
    "piexif>=1.1.3",
    "pilgram>=2.0.0",
    "pillow>=10.1.0",
    "pixeloe>=1.0.0",
    "psutil>=7.2.2",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "pygithub>=2.10.0",
    "pymatting>=1.1.16",
    "pyopengl>=3.1.8",
    "pytest>=9.1.1",
    "pywavelets>=1.8.0",
    "pyyaml>=6.0.3",
    "rembg>=2.0.69",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rotary-embedding-torch>=0.5.3",
    "safetensors>=0.4.2",
    "sageattention>=1.0.6",
    "sam-2",
    "scikit-image>=0.20.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "sentencepiece>=0.1.99",
    "simpleeval>=1.0.0",
    "soundfile>=0.14.0",
    "spandrel>=0.4.2",
    "sqlalchemy>=2.0.0",
    "timm>=0.9",
    "tokenizers>=0.13.3",
    "toml>=0.10.2",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchsde>=0.2.6",
    "torchvision>=0.29.1",
    "tqdm>=4.66",
    "transformers>=4.50.3",
    "triton-windows>=3.8.0.post29 ; sys_platform == 'win32'",
    "typer>=0.27.3",
    "typing-extensions>=4.16.0",
    "ultralytics>=8.4.123",
    "uv>=0.13.6",
    "wordcloud>=1.9.6",
    "yarl>=1.18.0",
]

[project.urls]
homepage = "https://www.comfy.org/"
repository = "https://github.com/comfyanonymous/ComfyUI"
documentation = "https://docs.comfy.org/"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
sam-2 = { git = "https://github.com/facebookresearch/sam2" }
cstr = { git = "https://github.com/ltdrdata/cstr" }
ffmpy = { git = "https://github.com/ltdrdata/ffmpy.git" }
img2texture = { git = "https://github.com/ltdrdata/img2texture.git" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
lint.select = [
  "N805", # invalid-first-argument-name-for-method
  "S307", # suspicious-eval-usage
  "S102", # exec
  "E",
  "T",    # print-usage
  "W",
  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
  # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
  "F",
]

lint.ignore = ["E501", "E722", "E731", "E712", "E402", "E741"]

exclude = ["*.ipynb", "**/generated/*.pyi"]

[tool.pylint]
master.py-version = "3.12"
master.extension-pkg-allow-list = [
  "pydantic",
]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "line-too-long",
  "too-few-public-methods",
  "too-many-public-methods",
  "too-many-instance-attributes",
  "too-many-positional-arguments",
  "broad-exception-raised",
  "too-many-lines",
  "invalid-name",
  "unused-argument",
  "broad-exception-caught",
  "consider-using-with",
  "fixme",
  "too-many-statements",
  "too-many-branches",
  "too-many-locals",
  "too-many-arguments",
  "too-many-return-statements",
  "too-many-nested-blocks",
  "duplicate-code",
  "abstract-method",
  "superfluous-parens",
  "arguments-differ",
  "redefined-builtin",
  "unnecessary-lambda",
  "dangerous-default-value",
  "invalid-overridden-method",
  # next warnings should be fixed in future
  "bad-classmethod-argument",  # Class method should have 'cls' as first argument
  "wrong-import-order",  # Standard imports should be placed before third party imports
  "ungrouped-imports",
  "unnecessary-pass",
  "unnecessary-lambda-assignment",
  "no-else-return",
  "unused-variable",
]
