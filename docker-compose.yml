services:
  comfyui:
    image: comfyui:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comfyui
    restart: unless-stopped
    gpus: all
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    volumes:
      - type: bind
        source: ./models
        target: /comfyui/models
      - type: bind
        source: ${COMFYUI_ADDITIONAL_MODELS:-F:/Comfyui/models}
        target: /models/additional
        read_only: true
      - type: bind
        source: ./extra_model_paths.docker.yaml
        target: /comfyui/extra_model_paths.docker.yaml
        read_only: true
      - type: bind
        source: ./custom_nodes
        target: /comfyui/custom_nodes
      - type: bind
        source: ./input
        target: /comfyui/input
      - type: bind
        source: ./output
        target: /comfyui/output
      - type: bind
        source: ./temp
        target: /comfyui/temp
      - type: bind
        source: ./user
        target: /comfyui/user
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    command:
      - python
      - main.py
      - --listen
      - 0.0.0.0
      - --port
      - "8188"
      - --extra-model-paths-config
      - /comfyui/extra_model_paths.docker.yaml
    shm_size: "8gb"
    stop_grace_period: 30s
